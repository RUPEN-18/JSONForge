<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSONForge — JSON workbench</title><link rel="stylesheet" href="style.css"></head><body><main><header><div class="eyebrow">DEVELOPER WORKBENCH / 01</div><h1>JSON<span>Forge</span></h1><p>Inspect, format and explore JSON without sending your data to a server.</p></header><section class="panel"><div class="heading"><h2>Source JSON</h2><button id="sample" class="secondary">Load sample</button></div><label for="source">Paste JSON or import a file</label><input id="file" type="file" accept=".json,application/json"><textarea id="source" spellcheck="false" placeholder='{"name":"JSONForge"}'></textarea><div class="actions"><button id="format">Format & validate</button><button id="minify" class="secondary">Minify</button><button id="clear" class="secondary">Clear</button><label for="indent">Indent</label><select id="indent"><option value="2">2 spaces</option><option value="4">4 spaces</option></select></div><p id="status" role="status">Ready for input.</p></section><div class="grid"><section class="panel"><div class="heading"><h2>Output</h2><div><button id="copy" class="secondary" disabled>Copy</button><button id="download" class="secondary" disabled>Save JSON</button></div></div><textarea id="output" readonly aria-label="Formatted JSON"></textarea><p id="stats" class="muted">No output yet.</p></section><section class="panel"><h2>Structure explorer</h2><label for="search">Search paths, types or values</label><input id="search" placeholder="name, array, $. ..."><p id="count" class="muted"></p><div id="tree" role="list" class="tree"></div></section></div><footer>LOCAL-FIRST UTILITY · Native JavaScript · JSON only</footer></main><script src="core.js"></script><script src="app.js"></script></body></html>
